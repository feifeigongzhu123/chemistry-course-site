<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>高一化学 · 动画精讲</title>
<style>
﻿*{box-sizing:border-box}
:root{
  --ink:#22314a; --muted:#7c8aa3; --line:#e8e2d6; --paper:#f5f1e8;
  --teal:#0e8a7b; --teal-dark:#0a6b60; --card:#ffffff;
  --shadow:0 18px 50px rgba(60,50,30,.08);
}
html,body{margin:0}
body{
  background:
    radial-gradient(900px 420px at 50% -160px,#fffaf0 0%,rgba(255,250,240,0) 65%),
    var(--paper);
  color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
.app{max-width:920px;margin:0 auto;padding:20px 14px 40px}
.hidden{display:none!important}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow)}
.kicker{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:800;letter-spacing:.7px;color:var(--teal);
  background:#e8f7f3;border-radius:999px;padding:5px 10px}
.pill{font-size:10px;font-weight:800;color:var(--teal);background:#e8f7f3;border-radius:999px;padding:7px 11px;white-space:nowrap}
h1{font-size:23px;font-weight:900;letter-spacing:-.4px;margin:10px 0 6px;line-height:1.32}
.sub{font-size:12px;color:var(--muted);line-height:1.65}

/* ===== 首页 ===== */
.hero{background:linear-gradient(155deg,#ffffff 0%,#f7fbfa 60%,#f3f7fb 100%);border-radius:26px}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stats div{background:#f8fafc;border:1px solid #e8eef5;border-radius:14px;padding:10px 8px;text-align:center}
.stats b{display:block;font-size:20px;font-weight:900;color:var(--teal-dark)}
.stats span{display:block;font-size:10px;color:var(--muted);margin-top:2px}
.units{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.unit{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 8px 24px rgba(60,50,30,.04)}
.unit-head{width:100%;display:flex;align-items:center;gap:10px;padding:14px 16px;background:none;border:0;cursor:pointer;text-align:left}
.unit-title{font-weight:800;font-size:14px;flex:1}
.unit-meta{font-size:10px;color:var(--muted);white-space:nowrap}
.chev{color:var(--muted);font-size:14px;transition:transform .2s}
.unit.closed .chev{transform:rotate(-90deg)}
.unit.closed .unit-body{display:none}
.point-row{width:100%;display:flex;align-items:center;gap:12px;padding:12px 16px;border:0;border-top:1px solid #f1f4f9;background:#fff;cursor:pointer;text-align:left}
.point-row:hover{background:#f8fbfa}
.pnum{width:30px;height:30px;flex:none;border-radius:10px;background:#f1f5f9;color:#64748b;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center}
.point-row.done .pnum{background:#e7f7f2;color:var(--teal-dark)}
.pinfo{flex:1;min-width:0}
.pinfo b{display:block;font-size:13.5px;font-weight:800;line-height:1.4}
.pinfo em{display:block;font-style:normal;font-size:10.5px;color:var(--muted);margin-top:3px}
.badge{flex:none;font-size:10px;font-weight:800;color:#64748b;background:#f1f5f9;border-radius:999px;padding:5px 9px}
.badge.done{color:var(--teal-dark);background:#e7f7f2}
.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px;padding:0 4px}
.foot span{font-size:10px;color:var(--muted)}
#reset{border:1px solid #e5e7ef;background:#fff;border-radius:999px;padding:8px 14px;font-size:11px;font-weight:700;color:#64748b;cursor:pointer}
#downloadAll{border:1px solid #c9ece4;background:#e7f7f2;border-radius:999px;padding:8px 14px;font-size:11px;font-weight:800;color:var(--teal-dark);cursor:pointer}
#downloadAll:disabled{opacity:.65;cursor:default}

/* ===== 课程页 ===== */
.lesson-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 2px 10px}
.top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.portal{font-size:10.5px;font-weight:800;color:var(--teal-dark);text-decoration:none;background:#f8fafc;border:1px solid #e5e7ef;border-radius:999px;padding:7px 11px;white-space:nowrap}
.portal:hover{background:#e7f7f2;border-color:#c9ece4}
#back{border:1px solid #e5e7ef;background:#fff;border-radius:999px;padding:8px 14px;font-size:11.5px;font-weight:800;color:#475569;cursor:pointer}
.crumb{font-size:10.5px;color:var(--muted);text-align:right;line-height:1.4}
.lesson .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.lesson .sub{margin-top:2px}
#learnedTag.learned{background:#e7f7f2;color:var(--teal-dark)}
.steps{display:flex;gap:7px;overflow:auto;padding:2px 1px 12px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.step{border:1px solid #e5e7ef;background:#f8f9fc;color:#6b7488;font-size:10.5px;font-weight:800;padding:8px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:.16s}
.step.on{background:var(--teal);border-color:var(--teal);color:#fff;box-shadow:0 8px 18px -10px rgba(14,138,123,.9)}
.stage-wrap{border-radius:20px;overflow:hidden;border:1px solid #dce9f5;background:#f5faff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.7);position:relative}
.scene{display:none}
.scene.on{display:block;animation:sceneIn .4s ease}
.scene svg{display:block;width:100%;height:auto}
.scene text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
@keyframes sceneIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.caption{background:#f7f9fc;border:1px solid #e6edf6;border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.75;color:#3a4a63;margin:12px 0 10px;min-height:52px;display:block}
.caption b{color:var(--teal-dark)}
.equation{display:none;background:#eefaf7;border:1px solid #c9ece4;border-radius:13px;padding:9px 12px;font-size:12.5px;line-height:1.7;color:var(--teal-dark);font-weight:700;margin-bottom:10px;text-align:center}
.equation.show{display:block}
.equation span{display:block;font-size:10px;font-weight:600;color:#6b8f89;margin-top:2px}
.readouts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.readout{background:#fbfcfe;border:1px solid #e8edf5;border-radius:12px;padding:9px 8px;text-align:center}
.readout span{display:block;font-size:9px;color:var(--muted);letter-spacing:.4px}
.readout b{display:block;font-size:14px;font-weight:900;margin-top:3px;color:#25324a;line-height:1.35}
.controls{display:flex;gap:8px}
.play{flex:1;border:0;border-radius:14px;padding:12px;font-size:14px;font-weight:900;color:#fff;background:linear-gradient(135deg,#18a892,#0e8a7b);box-shadow:0 12px 26px -12px rgba(14,138,123,.9);cursor:pointer}
.play:active{transform:scale(.985)}
.play:disabled{opacity:.7;cursor:default}
.sound{border:1px solid #e5e7ef;background:#fff;color:#5d6679;font-size:10.5px;font-weight:800;padding:0 13px;border-radius:14px;cursor:pointer}
.pause{border:1px solid #d7e2f2;background:#f8fafc;color:#475569;font-size:10.5px;font-weight:800;padding:0 12px;border-radius:14px;cursor:pointer}
.pause:active{transform:scale(.98)}
button[hidden]{display:none!important}
.audio-progress{height:4px;background:#e8eef5;border-radius:999px;margin-top:10px;overflow:hidden}
.audio-progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,#18a892,#0e8a7b);border-radius:999px}
.note{font-size:10px;color:var(--muted);text-align:center;margin-top:12px;line-height:1.6}
.stage-hint{display:none;font-size:10px;color:var(--muted);text-align:center;margin:6px 0 -4px}

/* ===== 题目 ===== */
.q-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:24px 4px 10px}
.q-head h2{font-size:16px;margin:0;font-weight:900}
#qProgress{font-size:11px;color:var(--muted);font-weight:700}
#questions{display:flex;flex-direction:column;gap:12px}
.q{padding:16px}
.q-top{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:8px}
.q-idx{font-size:11px;font-weight:900;color:var(--teal-dark);letter-spacing:.5px}
.angle{font-size:10px;font-weight:800;color:#7c3aed;background:#f3e8ff;border-radius:999px;padding:4px 8px}
.source{font-size:10px;color:var(--muted);background:#f8fafc;border:1px solid #eef2f7;border-radius:999px;padding:4px 8px}
.stem{font-size:14px;line-height:1.7;margin:6px 0 12px;font-weight:600}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:10px 12px;border:1px solid #e3e9f2;background:#fbfcfe;border-radius:12px;cursor:pointer;line-height:1.55;font-size:13px;transition:.16s}
.opt:hover{border-color:#b9d8d2;background:#f6fbfa}
.opt .letter{width:21px;height:21px;border-radius:50%;background:#eef2f7;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;flex:none;margin-top:1px;color:#64748b}
.opt.correct{border-color:#86efac;background:#f0fdf4}
.opt.correct .letter{background:#16a34a;color:#fff}
.opt.wrong{border-color:#fca5a5;background:#fef2f2}
.opt.wrong .letter{background:#dc2626;color:#fff}
.opt:disabled{cursor:default;opacity:1}
.q-feedback{margin-top:12px;border-top:1px dashed #e5e7ef;padding-top:11px;animation:sceneIn .3s ease}
.verdict{font-size:13px;font-weight:900;margin-bottom:8px}
.verdict.ok{color:#0f766e}
.verdict.no{color:#b91c1c}
.notes p{font-size:12.5px;line-height:1.65;margin:4px 0;color:#5b6b82;padding-left:9px;border-left:3px solid #e5e7ef}
.notes p.ok{color:#0f766e;border-color:#86efac;font-weight:700}
.explain{background:#f7f9fc;border:1px solid #eef2f7;border-radius:10px;padding:9px 11px;font-size:12.5px;line-height:1.7;color:#3a4a63;margin-top:9px}
.explain b{color:var(--teal-dark)}
.q-actions{margin-top:9px}
.speak{border:1px solid #d7e2f2;background:#fff;border-radius:999px;padding:7px 13px;font-size:11.5px;font-weight:800;color:#3a4a63;cursor:pointer}
.speak:hover{border-color:#b9d8d2;color:var(--teal-dark)}
.lesson-nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.lesson-nav button{border:1px solid #e5e7ef;background:#fff;border-radius:999px;padding:10px 16px;font-size:11.5px;font-weight:800;color:#475569;cursor:pointer}
.error-bar{position:fixed;left:10px;right:10px;bottom:10px;background:#fef2f2;border:1px solid #fca5a5;color:#b91c1c;border-radius:12px;padding:8px 12px;font-size:11px;z-index:99;display:none}
.error-bar.show{display:block}

/* ===== 通用动画 ===== */
@keyframes flicker{0%,100%{transform:scaleY(1) translateY(0);opacity:.95}50%{transform:scaleY(1.06) translateY(-1px);opacity:1}}
@keyframes bubbleRise{0%{transform:translateY(6px) scale(.7);opacity:0}20%{opacity:1}100%{transform:translateY(-54px) scale(1.05);opacity:0}}
@keyframes smokeUp{0%{transform:translateY(10px) scale(.7);opacity:0}25%{opacity:.9}100%{transform:translateY(-46px) scale(1.25);opacity:0}}
@keyframes dashFlow{to{stroke-dashoffset:-60}}
@keyframes popIn{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes ringPulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.14);opacity:.55}}
@keyframes sparkFly{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(14px,-18px) scale(.3);opacity:0}}
@keyframes gasGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes j11drip{0%{transform:translateY(-8px);opacity:0}20%{opacity:1}100%{transform:translateY(24px);opacity:0}}
@keyframes j19settle{0%{transform:translateY(-18px);opacity:0}60%{opacity:1}100%{transform:translateY(34px);opacity:1}}

/* ===== j1-1 变化与性质 ===== */
[data-scene="j1-1"] .j11-waxLiquid{opacity:0;transition:opacity .9s ease}
[data-scene="j1-1"] .j11-waxSolid{opacity:1;transition:opacity .8s ease}
[data-scene="j1-1"] .j11-lampFlame{opacity:0;transition:opacity .45s}
[data-scene="j1-1"] .j11-candleFlame{opacity:0;transition:opacity .45s}
[data-scene="j1-1"] .j11-drop{opacity:0;transition:opacity .4s}
[data-scene="j1-1"] .j11-lime,[data-scene="j1-1"] .j11-limeTop{transition:fill 1.2s ease}
[data-scene="j1-1"] .j11-limeMilk{opacity:0;transition:opacity .8s}
[data-scene="j1-1"] .j11-tagPhys,[data-scene="j1-1"] .j11-tagChem{opacity:0;transition:opacity .4s}
[data-scene="j1-1"] .j11-summary{opacity:0;transform:translateY(10px);transition:opacity .45s,transform .45s}
[data-scene="j1-1"].s1 .j11-lampFlame{opacity:1;animation:flicker 1.3s ease-in-out infinite}
[data-scene="j1-1"].s1 .j11-waxSolid,[data-scene="j1-1"].s2 .j11-waxSolid,[data-scene="j1-1"].s3 .j11-waxSolid{opacity:0}
[data-scene="j1-1"].s1 .j11-waxLiquid,[data-scene="j1-1"].s2 .j11-waxLiquid,[data-scene="j1-1"].s3 .j11-waxLiquid{opacity:1}
[data-scene="j1-1"].s1 .j11-tagPhys{opacity:1}
[data-scene="j1-1"].s2 .j11-candleFlame,[data-scene="j1-1"].s3 .j11-candleFlame{opacity:1;animation:flicker 1.1s ease-in-out infinite}
[data-scene="j1-1"].s2 .j11-drop,[data-scene="j1-1"].s3 .j11-drop{opacity:1}
[data-scene="j1-1"].s2 .j11-drop ellipse,[data-scene="j1-1"].s3 .j11-drop ellipse{animation:j11drip 2.1s ease-in infinite}
[data-scene="j1-1"].s2 .j11-drop ellipse:nth-child(2),[data-scene="j1-1"].s3 .j11-drop ellipse:nth-child(2){animation-delay:.5s}
[data-scene="j1-1"].s2 .j11-drop ellipse:nth-child(3),[data-scene="j1-1"].s3 .j11-drop ellipse:nth-child(3){animation-delay:1s}
[data-scene="j1-1"].s2 .j11-drop ellipse:nth-child(4),[data-scene="j1-1"].s3 .j11-drop ellipse:nth-child(4){animation-delay:1.5s}
[data-scene="j1-1"].s2 .j11-lime,[data-scene="j1-1"].s3 .j11-lime{fill:#eef2f6}
[data-scene="j1-1"].s2 .j11-limeTop,[data-scene="j1-1"].s3 .j11-limeTop{fill:#e2e8f0}
[data-scene="j1-1"].s2 .j11-limeMilk,[data-scene="j1-1"].s3 .j11-limeMilk{opacity:1}
[data-scene="j1-1"].s2 .j11-tagChem{opacity:1}
[data-scene="j1-1"].s2 .j11-gas{animation:dashFlow 1.6s linear infinite}
[data-scene="j1-1"].s3 .j11-summary{opacity:1;transform:none}
[data-scene="j1-1"].s3 .j11-candleFlame{opacity:.25;animation:none}
[data-scene="j1-1"].s3 .j11-lampFlame{opacity:0}

/* ===== j1-2 基本操作 ===== */
[data-scene="j1-2"] .j12-glow{opacity:0;transition:opacity .4s}
[data-scene="j1-2"] .j12-st1,[data-scene="j1-2"] .j12-st2,[data-scene="j1-2"] .j12-st3{transition:opacity .45s}
[data-scene="j1-2"].s1 .j12-st2,[data-scene="j1-2"].s1 .j12-st3{opacity:.5}
[data-scene="j1-2"].s2 .j12-st1,[data-scene="j1-2"].s2 .j12-st3{opacity:.5}
[data-scene="j1-2"].s3 .j12-st1,[data-scene="j1-2"].s3 .j12-st2{opacity:.5}
[data-scene="j1-2"].s1 .j12-st1 .j12-glow,[data-scene="j1-2"].s2 .j12-st2 .j12-glow,[data-scene="j1-2"].s3 .j12-st3 .j12-glow{opacity:1}
[data-scene="j1-2"] .j12-flame{opacity:0;transition:opacity .4s}
[data-scene="j1-2"] .j12-steam{opacity:0;transition:opacity .5s}
[data-scene="j1-2"] .j12-fallingPowder{opacity:0}
[data-scene="j1-2"] .j12-drop{opacity:0}
[data-scene="j1-2"] .j12-zoom{opacity:0;transform:scale(.82);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s}
[data-scene="j1-2"].s1 .j12-fallingPowder{opacity:1;animation:j11drip 1.8s ease-in infinite}
[data-scene="j1-2"].s1 .j12-drop{opacity:1;animation:j11drip 1.6s ease-in infinite}
[data-scene="j1-2"].s2 .j12-flame{opacity:1;animation:flicker 1.2s ease-in-out infinite}
[data-scene="j1-2"].s2 .j12-steam{opacity:1}
[data-scene="j1-2"].s3 .j12-zoom{opacity:1;transform:none}
[data-scene="j1-2"].s1 .j12-st1{opacity:1}
[data-scene="j1-2"].s2 .j12-st2{opacity:1}
[data-scene="j1-2"].s3 .j12-st3{opacity:1}

/* ===== j1-3 空气 ===== */
[data-scene="j1-3"] .j13-smoke{opacity:0}
[data-scene="j1-3"] .j13-flame{opacity:0;transition:opacity .4s}
[data-scene="j1-3"] .j13-water{opacity:0;transform:scaleY(.04);transform-box:fill-box;transform-origin:bottom;transition:transform 1.5s cubic-bezier(.2,.8,.2,1),opacity .4s}
[data-scene="j1-3"] .j13-waterTop{opacity:0;transition:opacity .6s}
[data-scene="j1-3"] .j13-fifth{opacity:0;transition:opacity .5s}
[data-scene="j1-3"] .j13-beakerWater{transition:transform 1.4s ease;transform-box:fill-box;transform-origin:bottom}
[data-scene="j1-3"] .j13-panel{opacity:1}
[data-scene="j1-3"] .j13-placeholder{opacity:1;transition:opacity .4s}
[data-scene="j1-3"].s3 .j13-placeholder{opacity:0}
[data-scene="j1-3"] .j13-donut{opacity:0;transform:scale(.9);transform-box:fill-box;transform-origin:center;transition:opacity .5s,transform .5s}
[data-scene="j1-3"] .j13-leg,[data-scene="j1-3"] .j13-stamp{opacity:0;transition:opacity .45s}
[data-scene="j1-3"] .j13-clamp rect:nth-child(2){transition:transform .5s;transform-box:fill-box;transform-origin:right center}
[data-scene="j1-3"].s1 .j13-flame{opacity:1;animation:flicker 1.1s ease-in-out infinite}
[data-scene="j1-3"].s1 .j13-smoke{opacity:1}
[data-scene="j1-3"].s1 .j13-smoke circle{animation:smokeUp 2.4s ease-out infinite}
[data-scene="j1-3"].s1 .j13-smoke circle:nth-child(2){animation-delay:.5s}
[data-scene="j1-3"].s1 .j13-smoke circle:nth-child(3){animation-delay:1s}
[data-scene="j1-3"].s1 .j13-smoke circle:nth-child(4){animation-delay:1.5s}
[data-scene="j1-3"].s2 .j13-water,[data-scene="j1-3"].s3 .j13-water{opacity:.85;transform:scaleY(1)}
[data-scene="j1-3"].s2 .j13-waterTop,[data-scene="j1-3"].s3 .j13-waterTop{opacity:1}
[data-scene="j1-3"].s2 .j13-fifth,[data-scene="j1-3"].s3 .j13-fifth{opacity:1}
[data-scene="j1-3"].s2 .j13-beakerWater,[data-scene="j1-3"].s3 .j13-beakerWater{transform:scaleY(.9)}
[data-scene="j1-3"].s2 .j13-clamp rect:nth-child(2),[data-scene="j1-3"].s3 .j13-clamp rect:nth-child(2){transform:rotate(-22deg)}
[data-scene="j1-3"].s3 .j13-donut{opacity:1;transform:none}
[data-scene="j1-3"].s3 .j13-leg{opacity:1}
[data-scene="j1-3"].s3 .j13-leg:nth-child(5){transition-delay:.12s}
[data-scene="j1-3"].s3 .j13-leg:nth-child(6){transition-delay:.24s}
[data-scene="j1-3"].s3 .j13-leg:nth-child(7){transition-delay:.36s}
[data-scene="j1-3"].s3 .j13-leg:nth-child(8){transition-delay:.48s}
[data-scene="j1-3"].s3 .j13-leg:nth-child(9){transition-delay:.6s}
[data-scene="j1-3"].s3 .j13-stamp{opacity:1;transition-delay:.55s}

/* ===== j1-4 氧气 ===== */
[data-scene="j1-4"] .j14-b1,[data-scene="j1-4"] .j14-b2,[data-scene="j1-4"] .j14-b3{transition:opacity .5s,transform .5s;transform-box:fill-box;transform-origin:center}
[data-scene="j1-4"] .j14-glow{opacity:0;transition:opacity .4s}
[data-scene="j1-4"] .j14-splint,[data-scene="j1-4"] .j14-sulfurFlame,[data-scene="j1-4"] .j14-sparks{opacity:0}

  <g class="s52-z1">

<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="晶体硅芯片、二氧化硅光导纤维与新型无机非金属材料">
  <rect width="900" height="620" fill="url(#gBg)"/>
  <rect width="900" height="620" fill="url(#dotsPat)"/>
  <rect y="510" width="900" height="110" fill="url(#gBench)"/>

  <text x="450" y="56" font-size="18" font-weight="800" fill="#334155" text-anchor="middle">晶体硅 → 芯片；二氧化硅 → 光纤；碳化硅 → 耐高温材料</text>

  <!-- 晶体硅 -->
  <g class="s53-z1">

      <path d="M130 172 V316 M150 168 V320 M170 168 V320 M190 172 V316"/>

    <g fill="#64748b">
      <rect x="112" y="320" width="8" height="16" rx="2"/><rect x="132" y="320" width="8" height="16" rx="2"/>
      <rect x="152" y="320" width="8" height="16" rx="2"/><rect x="172" y="320" width="8" height="16" rx="2"/>

    </g>
    <text x="164" y="372" font-size="12" font-weight="800" fill="#334155" text-anchor="middle">半导体材料</text>
    <text x="164" y="398" font-size="12" fill="#475569" text-anchor="middle">导电性介于导体与绝缘体之间</text>
    <text x="164" y="428" font-size="12" fill="#475569" text-anchor="middle">制造芯片、晶体管、太阳能电池</text>
    <text x="164" y="458" font-size="12" font-weight="800" fill="#475569" text-anchor="middle">自然界中只以化合态存在</text>
  </g>

  <!-- 二氧化硅光纤 -->
  <g class="s53-z2">
    <rect class="s53-glow" x="312" y="84" width="300" height="400" rx="22" fill="#475569" fill-opacity=".07" stroke="#475569" stroke-width="2" stroke-dasharray="8 7"/>

    <rect x="330" y="228" width="264" height="42" rx="12" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
    <rect x="336" y="240" width="252" height="18" rx="9" fill="#bae6fd" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="330" cy="249" r="14" fill="#94a3b8" stroke="#475569" stroke-width="2"/>

      <circle cx="530" cy="249" r="5"/>
      <circle cx="570" cy="249" r="4"/>
    </g>
    <text x="462" y="192" font-size="13" font-weight="800" fill="#0e7490" text-anchor="middle">光在纤芯中全反射传播</text>
    <text x="462" y="320" font-size="12" fill="#475569" text-anchor="middle">SiO₂ 是酸性氧化物，不溶于水</text>
    <text x="462" y="344" font-size="12" fill="#475569" text-anchor="middle">能与 NaOH 溶液、氢氟酸反应</text>
    <text x="462" y="376" font-size="12" fill="#475569" text-anchor="middle">SiO₂ + 4HF → SiF₄↑ + 2H₂O</text>
    <text x="462" y="416" font-size="12" font-weight="800" fill="#334155" text-anchor="middle">光导纤维、石英玻璃、光学仪器</text>
    <text x="462" y="450" font-size="12" fill="#64748b" text-anchor="middle">氢氟酸能雕刻玻璃，不能保存在玻璃瓶中</text>
  </g>

  <!-- 新型材料 -->

    <text x="384" y="304" font-size="11" fill="#166534">降低反应所需能量</text>
    <text x="384" y="324" font-size="11" fill="#166534">正、逆反应速率同等加快</text>

  function hydrate(src){
    if(!canCache || blobUrls[src]) return Promise.resolve();
    return cacheOpen().then(function(c){ return rememberBlob(src, c); }).catch(function(){});
  }
  function hydratePoint(p){
    if(!canCache) return;
    cacheOpen().then(function(c){
      p.steps.forEach(function(s){ rememberBlob(s.audio, c); });
    }).catch(function(){});
  }
  function warm(src){
    if(!canCache) return Promise.resolve();
    return cacheOpen().then(function(c){
      return c.match(src).then(function(hit){
        if(hit) return rememberBlob(src, c);
        return fetch(src, { cache: 'no-store' }).then(function(r){
          if(!r.ok) throw new Error('HTTP ' + r.status);
          return c.put(src, r.clone()).then(function(){ return rememberBlob(src, c); });
        });
      });
    }).catch(function(){});
  }
  function playableSrc(src){ return blobUrls[src] || src; }
  function allAudio(){
    var list = [];
    DATA.forEach(function(p){ p.steps.forEach(function(s){ list.push(s); }); });
    return list;
  }
  function downloadAllAudio(){
    if(!canCache){
      window.alert(isFile
        ? '当前是本地文件打开，语音已经在本机，无需下载。'
        : '当前地址不是 HTTPS 或 localhost，浏览器不允许整学段缓存；直接播放仍会按需加载。');
      return;
    }
    if(current.downloading) return;
    var list = allAudio();
    var totalDur = 0;
    list.forEach(function(s){ totalDur += (s.dur || 0); });
    var perSec = /\.mp3$/i.test(list[0].audio) ? 6000 : 32000;
    var estMb = Math.max(1, Math.round(totalDur * perSec / 1048576));
    if(estMb >= 20 && !window.confirm('将下载本学段全部 ' + list.length + ' 段语音，约 ' + estMb + ' MB，继续吗？')) return;

    var btn = el('downloadAll');
    var done = 0, fail = 0, bytes = 0, index = 0;
    current.downloading = true;
    if(btn){ btn.disabled = true; btn.textContent = '准备下载…'; }

    function update(){
      if(btn) btn.textContent = '下载中 ' + done + '/' + list.length +
        (bytes ? ' · ' + (bytes / 1048576).toFixed(1) + ' MB' : '');
    }
    function worker(){
      if(index >= list.length) return Promise.resolve();
      var src = list[index++].audio;
      return cacheOpen().then(function(c){
        return c.match(src).then(function(hit){
          if(hit){ done++; update(); return; }
          return fetch(src, { cache: 'no-store' }).then(function(r){
            if(!r.ok) throw new Error('HTTP ' + r.status);
            bytes += Number(r.headers.get('content-length') || 0);
            return c.put(src, r.clone()).then(function(){ done++; update(); });
          });
        }).catch(function(){ fail++; update(); });
      }).then(function(){ return worker(); });
    }

    var jobs = [];
    for(var k = 0; k < 3; k++) jobs.push(worker());
    Promise.all(jobs).then(function(){
      current.downloading = false;
      if(btn){
        btn.disabled = false;
        btn.textContent = fail ? ('下载完成，失败 ' + fail + ' 段') : ('语音已缓存 ' + done + ' 段 ✓');
      }
      list.forEach(function(s){ hydrate(s.audio); });
    }).catch(function(){
      current.downloading = false;
      if(btn){ btn.disabled = false; btn.textContent = '下载失败，请重试'; }
    });
  }
  function updateDownloadState(){
    var btn = el('downloadAll');
    if(!btn || current.downloading) return;
    if(!canCache){
      btn.textContent = isFile ? '本地文件 · 无需下载' : '需 HTTPS 才能整学段缓存';
      btn.disabled = true;
      return;
    }
    var list = allAudio();
    cacheOpen().then(function(c){
      return Promise.all(list.map(function(s){ return c.match(s.audio); }));
    }).then(function(hits){
      if(current.downloading) return;
      var hit = 0;
      hits.forEach(function(h){ if(h) hit++; });
      btn.disabled = false;
      btn.textContent = hit === list.length
        ? ('语音已缓存 ' + hit + ' 段 ✓')
        : (hit ? ('继续下载语音 ' + hit + '/' + list.length) : '下载本学段语音');
    }).catch(function(){});
  }

  /* ---------- 首页 ---------- */
  function unitList(){
    var order = [], map = {};
    DATA.forEach(function(p){
      if(!map[p.unit]){ map[p.unit] = []; order.push(p.unit); }
      map[p.unit].push(p);
    });
    return order.map(function(u){ return { unit: u, points: map[u] }; });
  }

  function answeredCount(){
    var n = 0;
    for(var k in store.answers){ if(Object.prototype.hasOwnProperty.call(store.answers, k)) n++; }
    return n;
  }
  function wrongCount(){
    var n = 0;
    for(var k in store.wrong){ if(Object.prototype.hasOwnProperty.call(store.wrong, k)) n++; }
    return n;
  }
  function learnedCount(){
    var n = 0;
    for(var k in store.learned){ if(store.learned[k]) n++; }
    return n;
  }

  function updateStats(){
    var a = el('statLearned'), b = el('statAnswered'), c = el('statWrong');
    if(a) a.textContent = learnedCount();
    if(b) b.textContent = answeredCount();
    if(c) c.textContent = wrongCount();
  }

  function pointAnswered(p){
    var n = 0;
    p.questions.forEach(function(q){
      if(Object.prototype.hasOwnProperty.call(store.answers, q.id)) n++;
    });
    return n;
  }

  function renderHome(){
    var wrap = el('units');
    if(!wrap) return;
    var totalSteps = 0, totalQs = 0;
    DATA.forEach(function(p){ totalSteps += p.steps.length; totalQs += p.questions.length; });
    if(el('homeTitle')) el('homeTitle').textContent = DATA.length + ' 个知识点，每个 3 步看懂';
    var examLabel = (DATA[0] && DATA[0].grade === 'senior') ? '高考真题改编' : '中考真题改编';
    if(el('homeSub')) el('homeSub').textContent = totalSteps + ' 段动画 · ' + totalQs + ' 道' + examLabel + ' · 每题逐项解析';
    wrap.innerHTML = '';
    var idx = 0;
    unitList().forEach(function(group){
      var unit = document.createElement('div');
      unit.className = 'unit';
      var head = document.createElement('button');
      head.type = 'button';
      head.className = 'unit-head';
      head.setAttribute('aria-expanded', 'true');
      head.innerHTML =
        '<span class="unit-title">' + esc(group.unit) + '</span>' +
        '<span class="unit-meta">' + group.points.length + ' 个知识点</span>' +
        '<span class="chev">⌄</span>';
      head.addEventListener('click', function(){
        var closed = unit.classList.toggle('closed');
        head.setAttribute('aria-expanded', closed ? 'false' : 'true');
      });

      var body = document.createElement('div');
      body.className = 'unit-body';
      group.points.forEach(function(p){
        idx++;
        var n = pointAnswered(p);
        var learned = !!store.learned[p.id];
        var row = document.createElement('button');
        row.type = 'button';
        row.className = 'point-row' + (learned ? ' done' : '');
        row.setAttribute('data-point', p.id);
        var badge, badgeCls = 'badge';
        if(learned){ badge = '已学'; badgeCls += ' done'; }
        else if(n > 0){ badge = '已答 ' + n + '/5'; }
        else { badge = '动画'; }
        row.innerHTML =
          '<span class="pnum">' + (idx < 10 ? '0' + idx : idx) + '</span>' +
          '<span class="pinfo"><b>' + esc(p.name) + '</b><em>' + esc(p.subtitle) + '</em></span>' +
          '<span class="' + badgeCls + '">' + badge + '</span>';
        row.addEventListener('click', function(){ openPoint(p.id, 0); });
        body.appendChild(row);
      });

      unit.appendChild(head);
      unit.appendChild(body);
      wrap.appendChild(unit);
    });
    updateStats();
    updateDownloadState();
  }

  /* ---------- 课程页 ---------- */
  function renderChips(p){
    var box = el('stepChips');
    box.innerHTML = '';
    p.steps.forEach(function(s, i){
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'step';
      b.textContent = (i + 1) + ' · ' + s.label;
      b.addEventListener('click', function(){
        stopPlayback();
        startPlayback(i);
      });
      box.appendChild(b);
    });
  }

  function updateChips(i){
    var chips = el('stepChips').querySelectorAll('.step');
    for(var k = 0; k < chips.length; k++){
      chips[k].classList.toggle('on', k === i);
    }
  }

  function updateLearnedTag(){
    var tag = el('learnedTag');
    if(!tag || !current.point) return;
    if(store.learned[current.point.id]){
      tag.textContent = '已学';
      tag.classList.add('learned');
    }else{
      tag.textContent = '3 步动画';
      tag.classList.remove('learned');
    }
  }

  function markLearned(){
    if(!current.point) return;
    if(!store.learned[current.point.id]){
      store.learned[current.point.id] = 1;
      save();
      updateStats();
      updateLearnedTag();
    }
  }

  function setStep(i){
    var p = current.point;
    if(!p) return;
    i = Math.max(0, Math.min(2, i));
    current.step = i;

    var scenes = document.querySelectorAll('.scene');
    for(var k = 0; k < scenes.length; k++) scenes[k].classList.remove('on');
    var sc = document.getElementById('scene-' + p.id);
    if(sc){
      sc.classList.add('on');
      sc.className = 'scene on s' + (i + 1);
    }
    updateChips(i);

    var s = p.steps[i];
    el('caption').innerHTML = '<b>第 ' + (i + 1) + ' 步：</b>' + s.caption;

    var eq = el('equation');
    if(s.eq){
      eq.innerHTML = esc(s.eq) + (s.eqSub ? '<span>' + esc(s.eqSub) + '</span>' : '');
      eq.classList.add('show');
    }else{
      eq.classList.remove('show');
      eq.innerHTML = '';
    }

    var ro = el('readouts');
    ro.innerHTML = '';
    p.readoutLabels.forEach(function(label, k){
      var d = document.createElement('div');
      d.className = 'readout';
      d.innerHTML = '<span>' + esc(label) + '</span><b>' + esc(s.reads[k] || '—') + '</b>';
      ro.appendChild(d);
    });

    if(i === 2) markLearned();
  }

  function startPlayback(from){
    if(!current.point) return;
    stopAudio();
    current.playing = true;
    current.paused = false;
    current.from = (typeof from === 'number' && from >= 0 && from < 3) ? from : 0;
    var btn = el('play');
    if(btn) btn.disabled = true;
    setPlayText('加载语音…');
    showPause(false);
    playStep(current.from);
  }

  function preloadStep(i){
    if(!current.point || i >= 3) return;
    warm(current.point.steps[i].audio);
  }

  function failStep(i){
    detachAudio();
    current.playing = false;
    current.paused = false;
    current.from = i;
    resetBar();
    var b = el('play');
    if(b){ b.disabled = false; b.textContent = '↻ 重试'; }
    showPause(false);
  }

  function playStep(i){
    if(!current.playing || !current.point) return;
    if(i >= 3){
      current.playing = false;
      current.paused = false;
      current.from = 0;
      setPlayText('↻ 重播');
      var b = el('play');
      if(b) b.disabled = false;
      showPause(false);
      setBar(100);
      markLearned();
      return;
    }

    detachAudio();
    current.step = i;
    current.from = i;
    current.paused = false;
    setStep(i);
    resetBar();
    setPlayText('加载语音…');

    var s = current.point.steps[i];

    var a;
    try{
      a = new Audio(playableSrc(s.audio));
    }catch(e){
      failStep(i);
      return;
    }
    current.audio = a;
    a.preload = 'auto';
    a.muted = !current.soundOn;
    audioPool.push(a);
    if(audioPool.length > 120) audioPool.shift();

    a.onloadedmetadata = function(){
      if(current.audio !== a) return;
      setBar(0);
    };
    a.ontimeupdate = function(){
      if(current.audio !== a) return;
      var d = a.duration;
      if(!isFinite(d) || d <= 0) d = s.dur || 0;
      setBar(d > 0 ? (a.currentTime / d) * 100 : 0);
    };
    a.onplaying = function(){
      if(current.audio !== a) return;
      setPlayText('播放中…');
      showPause(true, '⏸ 暂停');
      preloadStep(i + 1);
    };
    a.onended = function(){
      if(current.audio !== a) return;
      a.onended = null;
      current.audio = null;
      playStep(i + 1);
    };
    a.onerror = function(){
      if(current.audio !== a) return;
      failStep(i);
    };

    var pr;
    try{
      pr = a.play();
    }catch(e){
      failStep(i);
      return;
    }
    if(pr && pr.catch){
      pr.catch(function(err){
        if(current.audio !== a) return;
        if(err && err.name === 'NotAllowedError'){
          current.paused = true;
          setPlayText('点击继续');
          showPause(true, '▶ 继续');
        }else{
          failStep(i);
        }
      });
    }
  }

  function togglePause(){
    if(!current.audio || !current.playing) return;
    var a = current.audio;
    var p = el('pause');
    if(current.paused){
      current.paused = false;
      if(p) p.textContent = '⏸ 暂停';
      setPlayText('播放中…');
      var pr = a.play();
      if(pr && pr.catch){
        pr.catch(function(){ current.paused = true; if(p) p.textContent = '▶ 继续'; });
      }
    }else{
      current.paused = true;
      try{ a.pause(); }catch(e){}
      if(p) p.textContent = '▶ 继续';
      setPlayText('已暂停');
    }
  }

  /* ---------- 题库 ---------- */
  function buildFeedback(q, chosen){
    var ok = chosen === q.answerIndex;
    var notes = q.optionNotes.map(function(n, i){
      return '<p class="' + (i === q.answerIndex ? 'ok' : '') + '">' + esc(n) + '</p>';
    }).join('');
    return '<div class="verdict ' + (ok ? 'ok' : 'no') + '">' +
      (ok ? '✓ 回答正确' : '✗ 正确答案是 ' + letter(q.answerIndex)) +
      '</div><div class="notes">' + notes + '</div>' +
      '<div class="explain"><b>解析</b> ' + esc(q.explanation) + '</div>' +
      '<div class="q-actions"><button class="speak" type="button">🔊 听讲解</button></div>';
  }

  function revealQuestion(card, q, chosen, qi){
    var opts = card.querySelectorAll('.opt');
    for(var i = 0; i < opts.length; i++){
      opts[i].disabled = true;
      if(i === q.answerIndex) opts[i].classList.add('correct');
      if(i === chosen && chosen !== q.answerIndex) opts[i].classList.add('wrong');
    }
    var fb = card.querySelector('.q-feedback');
    fb.innerHTML = buildFeedback(q, chosen);
    fb.classList.remove('hidden');
    var btn = fb.querySelector('.speak');
    btn.addEventListener('click', function(){
      speakQuestion(q, qi, btn);
    });
  }

  function renderQuestions(){
    var p = current.point;
    var wrap = el('questions');
    wrap.innerHTML = '';
    p.questions.forEach(function(q, qi){
      var card = document.createElement('div');
      card.className = 'q card';
      card.setAttribute('data-q', q.id);
      var opts = q.options.map(function(o, i){
        return '<button class="opt" type="button" data-i="' + i + '">' +
          '<span class="letter">' + letter(i) + '</span><span>' + esc(o) + '</span></button>';
      }).join('');
      card.innerHTML =
        '<div class="q-top"><span class="q-idx">Q' + (qi + 1) + '</span>' +
        '<span class="angle">' + esc(q.angle) + '</span>' +
        '<span class="source">' + esc(q.source) + '</span></div>' +
        '<p class="stem">' + esc(q.stem) + '</p>' +
        '<div class="opts">' + opts + '</div>' +
        '<div class="q-feedback hidden"></div>';

      var btns = card.querySelectorAll('.opt');
      for(var i = 0; i < btns.length; i++){
        (function(idx){
          btns[idx].addEventListener('click', function(){
            if(Object.prototype.hasOwnProperty.call(store.answers, q.id)) return;
            store.answers[q.id] = idx;
            if(idx === q.answerIndex){ delete store.wrong[q.id]; }
            else { store.wrong[q.id] = 1; }
            save();
            revealQuestion(card, q, idx, qi);
            updateStats();
            updateQProgress();
          });
        })(i);
      }

      if(Object.prototype.hasOwnProperty.call(store.answers, q.id)){
        revealQuestion(card, q, store.answers[q.id], qi);
      }
      wrap.appendChild(card);
    });
    updateQProgress();
  }

  function updateQProgress(){
    var p = current.point;
    if(!p) return;
    var n = pointAnswered(p);
    var right = 0;
    p.questions.forEach(function(q){
      var a = store.answers[q.id];
      if(a === q.answerIndex) right++;
    });
    el('qProgress').textContent = '已答 ' + n + '/5 · 答对 ' + right;
  }

  /* ---------- 语音朗读 ---------- */
  function pickVoice(){
    if(!('speechSynthesis' in window)) return null;
    var vs = window.speechSynthesis.getVoices() || [];
    for(var i = 0; i < vs.length; i++){
      if(/zh[-_]CN/i.test(vs[i].lang) || /Huihui|Chinese|中文|普通话/i.test(vs[i].name)) return vs[i];
    }
    return null;
  }

  function stopSpeech(){
    if('speechSynthesis' in window) window.speechSynthesis.cancel();
    if(current.speechBtn){
      current.speechBtn.textContent = '🔊 听讲解';
      current.speechBtn = null;
    }
  }

  function speakQuestion(q, qi, btn){
    if(!('speechSynthesis' in window)){ btn.textContent = '此设备不支持语音'; return; }
    if(current.speechBtn === btn){
      stopSpeech();
      return;
    }
    stopSpeech();
    var text = '第' + (qi + 1) + '题，正确答案是' + letter(q.answerIndex) + '。' + q.explanation;
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    u.rate = 0.95;
    u.pitch = 1;
    var v = pickVoice();
    if(v) u.voice = v;
    var self = btn;
    u.onend = function(){ if(current.speechBtn === self){ self.textContent = '🔊 听讲解'; current.speechBtn = null; } };
    u.onerror = function(){ if(current.speechBtn === self){ self.textContent = '🔊 听讲解'; current.speechBtn = null; } };
    current.speechBtn = btn;
    btn.textContent = '■ 停止';
    window.speechSynthesis.speak(u);
  }

  /* ---------- 打开知识点 ---------- */
  function updateHash(){
    if(!current.point) return;
    try{ history.replaceState(null, '', '#' + current.point.id + '/' + current.step); }catch(e){}
  }

  function openPoint(id, stepIdx, viaRow){
    var p = POINT_MAP[id];
    if(!p) return;
    stopPlayback();
    stopSpeech();
    current.point = p;
    current.index = DATA.indexOf(p);
    current.step = 0;

    el('home').classList.add('hidden');
    el('lesson').classList.remove('hidden');
    el('lessonKicker').textContent = p.unit;
    el('lessonTitle').textContent = p.title;
    el('lessonSub').textContent = p.subtitle;
    el('crumb').textContent = p.unit + ' · ' + p.name;

    renderChips(p);
    renderQuestions();
    setStep(typeof stepIdx === 'number' ? stepIdx : 0);
    updateLearnedTag();
    current.from = 0;
    hydratePoint(p);

    var prev = el('prevPoint'), next = el('nextPoint');
    prev.disabled = current.index <= 0;
    next.disabled = current.index >= DATA.length - 1;
    prev.style.opacity = prev.disabled ? '.45' : '1';
    next.style.opacity = next.disabled ? '.45' : '1';

    var b = el('play');
    b.disabled = false;
    b.textContent = '▶ 播放讲解';

    updateHash();
    try{ window.scrollTo(0, 0); }catch(e){}
    if(viaRow){ /* 由用户点击进入，保持静音待播 */ }
  }

  function goHome(){
    stopPlayback();
    stopSpeech();
    current.point = null;
    el('lesson').classList.add('hidden');
    el('home').classList.remove('hidden');
    renderHome();
    try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){}
    try{ window.scrollTo(0, 0); }catch(e){}
  }

  /* ---------- 事件绑定 ---------- */
  el('back').addEventListener('click', goHome);
  el('play').addEventListener('click', function(){
    if(!current.point) return;
    if(current.playing) return;
    startPlayback(current.from || 0);
  });
  el('pause').addEventListener('click', togglePause);
  el('downloadAll').addEventListener('click', downloadAllAudio);
  el('sound').addEventListener('click', function(){
    current.soundOn = !current.soundOn;
    el('sound').textContent = current.soundOn ? '🔊 讲解' : '🔇 静音';
    if(current.audio) current.audio.muted = !current.soundOn;
  });
  el('prevPoint').addEventListener('click', function(){
    if(current.index > 0) openPoint(DATA[current.index - 1].id, 0);
  });
  el('nextPoint').addEventListener('click', function(){
    if(current.index < DATA.length - 1) openPoint(DATA[current.index + 1].id, 0);
  });
  el('reset').addEventListener('click', function(){
    if(!window.confirm('确定清空已学知识点、答题记录和错题吗？')) return;
    store = { learned: {}, answers: {}, wrong: {} };
    save();
    renderHome();
    if(current.point) goHome();
  });

  if('speechSynthesis' in window){
    window.speechSynthesis.onvoiceschanged = function(){ /* 触发一次语音列表加载 */ };
  }

  /* ---------- 初始化 ---------- */
  renderHome();

  var m = (location.hash || '').match(/^#((?:j[123]|s[1-8]|g[23])-(?:[1-9]|1[0-2]))(?:\/([0-2]))?$/);
  if(m && POINT_MAP[m[1]]){
    openPoint(m[1], m[2] ? Number(m[2]) : 0);
  }

  document.documentElement.setAttribute('data-ready', '1');
  document.documentElement.setAttribute('data-points', String(DATA.length));

  if(location.search.indexOf('debug=1') >= 0){
    setTimeout(function(){
      var w = function(id){ var e = el(id); return e ? e.offsetWidth : 0; };
      var vals = [w('stageBox'), w('caption'), w('readouts'), w('questions'), w('lesson'), document.body.scrollWidth];
      document.documentElement.setAttribute('data-debug', vals.join('/'));
    }, 600);
  }

  window.__JC = {
    data: DATA,
    open: openPoint,
    home: goHome,
    get errors(){ return errs.slice(); },
    get current(){
      return {
        playing: current.playing,
        paused: current.paused,
        step: current.step,
        soundOn: current.soundOn,
        audioTime: current.audio ? current.audio.currentTime : 0,
        audioDur: current.audio ? current.audio.duration : 0,
        audioSrc: current.audio ? current.audio.src : '',
        bar: el('audioBar') ? el('audioBar').style.width : ''
      };
    },
    activeAudios: function(){
      return audioPool.filter(function(a){ return !a.paused && !a.ended; }).length;
    },
    seek: function(sec){
      if(!current.audio) return;
      var d = current.audio.duration;
      if(!isFinite(d) || d <= 0) return;
      current.audio.currentTime = Math.max(0, Math.min(d - 0.25, sec));
    },
    downloadAll: downloadAllAudio,
    canCache: canCache,
    store: store
  };
})();

</script>
</body>
